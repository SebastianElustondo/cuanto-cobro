name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: HTML válido
        run: npm run lint:html
      - name: Links internos y sitemap
        run: npm run check:links
      - name: Sintaxis de los scripts del sitio
        run: npm run check
      - name: Pruebas de las fórmulas
        run: npm test
